[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance with decision economics"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "pydantic==2.12.5",
  "numpy==2.4.2",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "streamlit==1.54.0",
  "plotly==6.5.2",
]


[project.optional-dependencies]
full = ["torch==2.10.0", "xgboost==3.2.0", "mlflow==3.10.1"]
dev = [
  "hypothesis==6.165.10",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.1",
  "types-PyYAML==6.0.12.20250915",
  "cyclonedx-bom==7.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_maintenance"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["predictive_maintenance"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
