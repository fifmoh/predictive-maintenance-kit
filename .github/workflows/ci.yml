name: ci
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
      - name: Fetch pinned researchops wheel
        run: |
          curl -fsSL -o "$RUNNER_TEMP/researchops-0.1.0-py3-none-any.whl" \
            "https://raw.githubusercontent.com/fifmoh/mlops-research-starter/main/dist/researchops-0.1.0-py3-none-any.whl"
          echo "85df90cf107b3d9c1a2bc128cc8cd19282cd4528b31c501395523fd85c13fe0b  $RUNNER_TEMP/researchops-0.1.0-py3-none-any.whl" | shasum -a 256 -c -
      - run: make setup
        env:
          RESEARCHOPS_WHEEL: ${{ runner.temp }}/researchops-0.1.0-py3-none-any.whl
          RESEARCHOPS_SHA256: 85df90cf107b3d9c1a2bc128cc8cd19282cd4528b31c501395523fd85c13fe0b
      - run: make check test docs smoke
      - run: uv run cyclonedx-py environment --output-format JSON -o sbom.cdx.json
